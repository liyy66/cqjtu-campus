<style>:root{
  /* 浅色主题 */
  --blue:#0b4da2; --blue2:#1565c0; --deep:#08306b; --gold:#c9a227;
  --bg:#f2f5fa; --bg2:#e9eef7; --card:#ffffff; --line:#e3e9f2;
  --text:#1f2a3d; --muted:#6b7a90; --bubble:#eef3fb; --bubble-line:#dde7f6;
  --shadow:0 8px 22px rgba(11,77,162,.09); --shadow-lg:0 16px 40px rgba(8,48,107,.16);
  --grad:linear-gradient(120deg,#08306b,#1565c0);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blue:#7fb3ff; --blue2:#5b9dff; --deep:#0a1e3c; --gold:#e8c65a;
    --bg:#0d1424; --bg2:#111b30; --card:#16223a; --line:#24334f;
    --text:#e8eefb; --muted:#93a3bd; --bubble:#1b2a47; --bubble-line:#2a3c5e;
    --shadow:0 8px 22px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    --grad:linear-gradient(120deg,#0a1e3c,#1c3f77);
  }
}
:root[data-theme="dark"]{
  --blue:#7fb3ff; --blue2:#5b9dff; --deep:#0a1e3c; --gold:#e8c65a;
  --bg:#0d1424; --bg2:#111b30; --card:#16223a; --line:#24334f;
  --text:#e8eefb; --muted:#93a3bd; --bubble:#1b2a47; --bubble-line:#2a3c5e;
  --shadow:0 8px 22px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
  --grad:linear-gradient(120deg,#0a1e3c,#1c3f77);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(21,101,192,.10), transparent 60%),
    radial-gradient(900px 420px at -10% 110%, rgba(201,162,39,.07), transparent 55%),
    var(--bg);
  color:var(--text);min-height:100vh;
  transition:background .45s ease,color .45s ease;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:rgba(21,101,192,.22)}

/* ============ 顶栏 ============ */
.topbar{
  background:var(--grad);color:#fff;padding:20px 28px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  position:relative;overflow:hidden;
}
.topbar::after{ /* 流光 */
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.14) 48%,transparent 62%);
  transform:translateX(-120%);animation:sheen 7s ease-in-out infinite;
}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.emblem{
  width:58px;height:58px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 6px 18px rgba(0,0,0,.28),0 0 0 3px rgba(255,255,255,.28);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.emblem:hover{transform:rotate(-8deg) scale(1.07)}
.emblem img{width:50px;height:50px;border-radius:50%}
.topbar h1{font-size:21px;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.topbar p{font-size:12.5px;opacity:.85;margin-top:3px}
.badge-live{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:400;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:3px 10px;border-radius:999px;
}
.badge-live i{width:6px;height:6px;border-radius:50%;background:#7dffb3;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.top-actions{display:flex;align-items:center;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.official-link{
  color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);
  padding:9px 17px;border-radius:999px;font-size:13.5px;transition:.25s;backdrop-filter:blur(4px);
}
.official-link:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.official-link:active{transform:scale(.94)}

/* ============ 标签页 ============ */
.tabs{
  display:flex;gap:8px;padding:14px 28px 0;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  transition:background .45s ease,border-color .45s ease;
}
.tab{
  border:none;background:none;padding:13px 22px;font-size:15px;cursor:pointer;
  color:var(--muted);border-bottom:3px solid transparent;border-radius:12px 12px 0 0;
  transition:color .25s,background .25s,transform .18s;position:relative;overflow:hidden;
}
.tab:hover{color:var(--blue);background:var(--bg2)}
.tab:active{transform:scale(.94)}
.tab.active{color:var(--blue);font-weight:600;border-bottom-color:var(--blue);background:var(--bg)}
.tab .ico{display:inline-block;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}

/* ========================= 🌿 粒子动效引擎 ========================= */
const fx = {
  canvas: null, ctx: null, parts: [], mode: "none", raf: 0, w: 0, h: 0,
  reduce: window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
};
function fxInit() {
  fx.canvas = $("#fxCanvas");
  fx.ctx = fx.canvas.getContext("2d");
  fxResize();
  window.addEventListener("resize", () => { fxResize(); fxSpawn(fx.mode); });
}
function fxResize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.w = window.innerWidth; fx.h = window.innerHeight;
  fx.canvas.width = fx.w * dpr; fx.canvas.height = fx.h * dpr;
  fx.canvas.style.width = fx.w + "px"; fx.canvas.style.height = fx.h + "px";
  fx.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const FX_PRESETS = {
  leaves:  { n: 26, colors: ["#e8a13c","#d97b29","#c25a1f","#e8c25a","#b8642e"] },
  fireflies:{ n: 42, colors: ["#ffe9a8","#fff6d8","#c9f7d4","#bfe8ff"] },
  snow:    { n: 60, colors: ["#ffffff","#e8f1ff","#d6e6ff"] },
  stars:   { n: 70, colors: ["#ffffff","#cfe0ff","#ffe9c9"] },
  petals:  { n: 30, colors: ["#ffc7d9","#ffb3c8","#ffe0ea","#f79ac0"] },
  dust:    { n: 34, colors: ["#fff2cf","#ffe3b3","#e8d3b0"] },
};
function fxSpawn(mode) {
  fx.mode = mode;
  fx.parts = [];
  if (fx.reduce || !FX_PRESETS[mode]) return;
  const p = FX_PRESETS[mode];
  for (let i = 0; i < p.n; i++) {
    fx.parts.push({
      x: Math.random() * fx.w, y: Math.random() * fx.h,
      r: mode === "leaves" ? 6 + Math.random() * 9 : 1 + Math.random() * 3.2,
      vx: (Math.random() - .5) * (mode === "fireflies" ? .35 : .8),
      vy: mode === "snow" ? .35 + Math.random() * .8 :
          mode === "leaves" ? .5 + Math.random() * 1.1 :
          mode === "petals" ? .45 + Math.random() * .9 :
          mode === "stars" ? 0 : .12 + Math.random() * .3,
      a: .35 + Math.random() * .6,
      spin: (Math.random() - .5) * .06,
      ang: Math.random() * Math.PI * 2,
      phase: Math.random() * Math.PI * 2,
      color: p.colors[(Math.random() * p.colors.length) | 0],
    });
  }
}
function fxTick() {
  const c = fx.ctx;
  c.clearRect(0, 0, fx.w, fx.h);
  const t = performance.now() / 1000;
  for (const p of fx.parts) {
    p.x += p.vx + Math.sin(t * .8 + p.phase) * (fx.mode === "fireflies" ? .5 : .22);
    p.y += p.vy;
    p.ang += p.spin;
    if (p.y > fx.h + 20) { p.y = -20; p.x = Math.random() * fx.w; }
    if (p.x > fx.w + 20) p.x = -20;
    if (p.x < -20) p.x = fx.w + 20;
    c.save();
    c.translate(p.x, p.y);
    c.rotate(p.ang);
    if (fx.mode === "leaves") {
      c.globalAlpha = p.a * .9;
      c.fillStyle = p.color;
      c.beginPath();
      c.ellipse(0, 0, p.r, p.r * .55, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = "rgba(90,50,10,.25)";
      c.lineWidth = 1;
      c.beginPath(); c.moveTo(-p.r, 0); c.lineTo(p.r, 0); c.stroke();
    } else if (fx.mode === "petals") {
      c.globalAlpha = p.a * .85;
      c.fillStyle = p.color;
      c.beginPath();
      c.ellipse(0, 0, p.r * 1.6, p.r, 0, 0, Math.PI * 2);
      c.fill();
    } else if (fx.mode === "stars") {
      const tw = .55 + .45 * Math.sin(t * 1.6 + p.phase);
      c.globalAlpha = p.a * tw;
      c.fillStyle = p.color;
      c.beginPath(); c.arc(0, 0, p.r, 0, Math.PI * 2); c.fill();
    } else if (fx.mode === "fireflies") {
      const glow = .5 + .5 * Math.sin(t * 1.2 + p.phase);
      c.globalAlpha = p.a * (.35 + .5 * glow);
      c.fillStyle = p.color;
      c.shadowBlur = 12; c.shadowColor = p.color;
      c.beginPath(); c.arc(0, 0, p.r * (1 + glow * .6), 0, Math.PI * 2); c.fill();
    } else {
      c.globalAlpha = p.a * (fx.mode === "dust" ? .5 : 1);
      c.fillStyle = p.color;
      c.beginPath(); c.arc(0, 0, p.r, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
  fx.raf = requestAnimationFrame(fxTick);
}

/* ---- 对话导出 / 导入 --------------------------------------------
   为什么需要：对话存在 localStorage，而 localStorage 按「域名」隔离。
   换网址、换设备、换浏览器都会看不到之前的记录。导出一个 JSON 文件
   就能把记录带走，在另一个地方导入恢复。                      */
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
}
$("#exportBtn") && $("#exportBtn").addEventListener("click", () => {
  if (!convs.length || (convs.length === 1 && !convs[0].messages.length)) {
    toast("还没有对话可以导出");
    return;
  }
  const total = convs.reduce((s, c) => s + c.messages.length, 0);
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}-${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
  downloadJSON({
    app: "cqjtu-campus-assistant",
    version: 1,
    exportedAt: new Date().toISOString(),
    convs: convs,
  }, `重庆交大助手-对话备份-${stamp}.json`);
  toast(`已导出 ${convs.length} 个对话，共 ${total} 条消息`);
});

        .filter((c) => c && typeof c === "object")
        .map((c) => ({

          title: c.title || "导入对话",
          created: c.created || Date.now(),
          messages: Array.isArray(c.messages) ? c.messages : [],
        }));
      if (!clean.length) throw new Error("没有对话");
      /* 合并：已存在同 id 则跳过，避免重复导入自己 */
      const have = new Set(convs.map((c) => c.id));

      convs = add.concat(convs).slice(0, 60);

      saveConvs(); renderConvList(); renderChat();
      toast(add.length ? `已导入 ${add.length} 个对话` : "这些对话已经导入过了");
    } catch (err) {
      toast("导入失败：不是有效的备份文件");
    }
    e.target.value = "";
  };
  rd.readAsText(f);
});

const LS_KEY = "cqjtu_news_v1";
let NEWS = (EMBED.news || []).slice();
let KNOW = EMBED.knowledge || [];
const FAQ = EMBED.faq || [];

/* ---- 正文按需加载 ------------------------------------------------
   构建时正文被抽到 data/bodies/part-XX.json，这里按需取回并
   回填到 news.content_text。这样首页只需内嵌列表（体积小），
   正文在用户点开某条新闻时才加载。                        */
const PART_CACHE = new Map();
const PART_PENDING = new Map();
async function loadPart(name) {
  if (!name) return {};
  if (PART_CACHE.has(name)) return PART_CACHE.get(name);
  if (PART_PENDING.has(name)) return PART_PENDING.get(name);
  const p = fetch("data/bodies/" + name)
    .then((r) => (r.ok ? r.json() : []))
    .then((arr) => {
      const m = {};
      (arr || []).forEach((x) => { if (x && x.id) m[x.id] = x.c || ""; });
      PART_CACHE.set(name, m);
      PART_PENDING.delete(name);
      return m;
    })
    .catch(() => { PART_PENDING.delete(name); return {}; });
  PART_PENDING.set(name, p);
  return p;
}
function newsKey(n) { return String(n.id || (n.url || "").split("/").pop().split(".")[0]); }
/* 确保该新闻的正文已就位；返回正文文本 */
async function ensureBody(n) {
  if (!n) return "";
  if (n.content_text) return n.content_text;
  if (!n.part) return "";
  const m = await loadPart(n.part);
  const t = m[newsKey(n)];
  if (t) n.content_text = t;
  return n.content_text || "";
}
/* 搜索用：把需要的正文批量灌入 docs（只灌命中标题/摘要的，省流量） */
async function hydrateForSearch(qset) {
  const need = NEWS.filter((n) => !n.content_text && n.part && (() => {
    const hay = (n.title || "") + " " + (n.summary || "");
    for (const t of qset) if (hay.includes(t)) return true;
    return false;
  })());
  if (!need.length) return;
  const names = Array.from(new Set(need.map((n) => n.part)));
  await Promise.all(names.map((n) => loadPart(n)));
  need.forEach((n) => {
    const t = PART_CACHE.get(n.part);
    if (t) n.content_text = t[newsKey(n)] || "";
  });
}

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
    if (Array.isArray(saved)) mergeNews(saved);
  } catch (e) {}
}
function saveNews(items) {
  try {
    const base = EMBED.news.map((n) => n.url);
    const extras = NEWS.filter((n) => !base.includes(n.url)).slice(0, 200);
    localStorage.setItem(LS_KEY, JSON.stringify(extras));
  } catch (e) {}
}
function mergeNews(items) {
  const byUrl = new Map(NEWS.map((n) => [n.url, n]));
  let added = 0;
  items.forEach((n) => {
    if (!n.url) return;
    const old = byUrl.get(n.url);
    if (!old) { byUrl.set(n.url, n); added++; }
    else if (!old.content_text && n.content_text) Object.assign(old, n);
  });
  NEWS = Array.from(byUrl.values()).sort((a, b) =>
    (b.date || "").localeCompare(a.date || "") || (b.url || "").localeCompare(a.url || ""));
  return added;
}

const COL_NAMES = { szyw: "时政要闻", zjal: "精彩交大", jxgz: "教学工作", kxyj: "科学研究", hzjl: "合作交流", rwjd: "人文交大", zsjy: "招生就业", xydt: "学院动态", xxtz: "信息通知", xsxx: "学术信息", zbxx: "招标信息", xxxz: "莘莘学子", mtjd: "媒体交大" };
const PROXIES = [
  (u) => u,
  (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  (u) => "https://api.allorigins.win/get?url=" + encodeURIComponent(u),
  (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  (u) => "https://corsproxy.org/?url=" + encodeURIComponent(u),
  (u) => "https://api.cors.lol/?url=" + encodeURIComponent(u),
  (u) => "https://yacdn.org/proxy/" + u,
  (u) => "https://thingproxy.freeboard.io/fetch/" + u,
  (u) => "https://test.cors.workers.dev/?" + u,
  (u) => "https://r.jina.ai/" + u,
];
async function fetchText(url, timeoutMs = 9000) {
  for (const wrap of PROXIES) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), timeoutMs);
      const r = await fetch(wrap(url), { signal: ctl.signal });
      clearTimeout(timer);
      if (!r.ok) continue;
      let text = await r.text();
      const t = text.trim();
      if (t.startsWith("{") && t.includes("contents")) {
        try { text = JSON.parse(t).contents || text; } catch (e) {}
      }
      if (text && text.length > 400) return text;
    } catch (e) {}
  }
  return null;
}
function parseArticle(html, url) {
  const title = (html.match(/<h1[^>]*class=["']article-title["'][^>]*>([\s\S]*?)<\/h1>/i)?.[1] || "").replace(/<[^>]+>/g, "").trim();
  const editor = (html.match(/<div[^>]*class=["']article-editor["'][^>]*>([\s\S]*?)<\/div>/i)?.[1] || "").replace(/<[^>]+>/g, " ");
  const date = (editor.match(/日期[：:]\s*(20\d{2}[-年]\d{1,2}[-月]\d{1,2}日?)/)?.[1] || "")
    .replace(/(\d{4})年(\d{1,2})月(\d{1,2})日?/, (s, y, mo, d) => `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`)
    .replace(/(\d{4})-(\d{1,2})-(\d{1,2})/, (s, y, mo, d) => `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  const source = (editor.match(/来源[：:]\s*([^\s]{1,40})/)?.[1] || "").trim();
  const author = (editor.match(/作者[：:]\s*([^\s]{1,40})/)?.[1] || "").trim();
  let content = html.match(/<div[^>]*class=["'][^"']*v_news_content[^"']*["'][^>]*>([\s\S]*?)<\/div>\s*<\/div>/i)?.[1] || "";
  content = content.replace(/<(script|style|iframe)[^>]*>[\s\S]*?<\/\1>/gi, "");
  const abs = (src) => /^https?:/i.test(src) ? src : (src.startsWith("/") ? "https://news.cqjtu.edu.cn" + src : "https://news.cqjtu.edu.cn/" + src);
  content = content.replace(/<img[^>]*src=["']([^"']+)["'][^>]*>/gi, (s, src) => `<img src="${abs(src)}" alt="" loading="lazy" style="max-width:100%;">`);
  content = content.replace(/<a\b[^>]*>([\s\S]*?)<\/a>/gi, "$1");
  return { title, date, source, author, content_html: content.trim(), content_text: content.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim() };
}

function esc(s) {
  return (s || "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function renderSources(sources) {
  if (!sources || !sources.length) return "";
  let h = `<div class="cite"><div class="cite-title">📎 官方出处（点击卡片跳转原文）</div>`;
  sources.forEach((s, i) => {
    h += `<a href="${esc(s.url)}" onclick="openLink('${esc(s.url)}');return false;">
      <span class="num">${i + 1}</span>
      <span class="src-main"><span>${esc(s.title || "官方来源")}</span>

function openLink(url) {
  if (!url) return;
  try {
    const w = window.open("about:blank", "_blank");
    if (!w) { window.location.href = url; return; }
    w.opener = null; w.location.href = url;
  } catch (e) { window.location.href = url; }
}
function copyText(t, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "✅ 已复制"; setTimeout(() => (btn.textContent = o), 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, () => window.prompt("复制链接：", t));
  } else window.prompt("复制链接：", t);
}

/* ---- 分词 ---- */
const STOP = new Set("的了和是在有与及或这那你们我们他们一个什么怎么请问吗呢啊吧就都也而其之对于关于可以可将被把从向于为以并且且还是不是有没有哪些哪个如何多少".split(""));
function tokenize(text) {
  text = (text || "").toLowerCase();
  const toks = [];
  for (const w of text.match(/[a-z0-9]+/g) || []) toks.push(w);
  for (const seg of text.match(/[\u4e00-\u9fff]+/g) || []) {
    for (let i = 0; i < seg.length - 1; i++) {
      const bg = seg.slice(i, i + 2);
      if (!STOP.has(bg)) toks.push(bg);
    }
    for (let i = 0; i < seg.length - 2; i++) toks.push(seg.slice(i, i + 3));
  }
  return toks;
}
function pad(n) { return String(n).padStart(2, "0"); }
function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function isoOffset(days) { const d = new Date(); d.setDate(d.getDate() - days); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

function detectDateRange(q) {
  const today = new Date();
  if (q.includes("今天") && /新闻|消息|发生了/.test(q)) return [todayISO(), todayISO()];
  if (/昨天|昨日/.test(q)) return [isoOffset(1), isoOffset(1)];
  if (q.includes("前天")) return [isoOffset(2), isoOffset(2)];
  let m = q.match(/(20\d{2})年(\d{1,2})月(\d{1,2})日/);
  if (m) { const d = `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; return [d, d]; }
  m = q.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if (m) { const d = `${today.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`; return [d, d]; }
  m = q.match(/最近\s*(\d+|[一二两三四五六七八九十]+)\s*[天日]/);
  if (m && /新闻|消息/.test(q)) {
    const map = { 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
    const days = /^\d+$/.test(m[1]) ? +m[1] : (map[m[1]] || 7);
    return [isoOffset(days), todayISO()];
  }
  return null;
}

/* ---- 记忆：把上文拼进追问 ---- */
function buildQuery(q) {
  const msgs = curConv.messages.filter((m) => m.role === "user").slice(-3, -1);
  const followUp = /^(那|那么|它|他|她|这个|那个|上面|刚才|继续|还有|然后|呢|多少|什么|怎么)[^。！？]{0,20}[？?]?$/.test(q.trim())
    || (q.trim().length <= 10 && !/[，。！？]/.test(q) && msgs.length > 0);
  if (followUp && msgs.length) {
    return msgs.map((m) => m.text).join("；") + "；" + q;
  }
  return q;
}

function ask(question, memoryQuery) {
  const q = (question || "").trim();
  const full = (memoryQuery || q);
  if (!q) return { answer: "请输入关于重庆交通大学的问题。", sources: [] };

  /* 1) 日期型新闻 */
  const rng = detectDateRange(q) || detectDateRange(full);
  if (rng) {
    const [d1, d2] = rng;
    const items = NEWS.filter((n) => n.date >= d1 && n.date <= d2);
    if (items.length) {
      const lines = [`官方新闻显示，${d1}${d1 !== d2 ? " 至 " + d2 : ""} 共有 ${items.length} 条相关新闻：`];
      items.slice(0, 12).forEach((n) => lines.push(`· ${n.date} 《${n.title}》（${n.column_name || "新闻"}）`));
      return { answer: lines.join("\n"), sources: items.slice(0, 12) };
    }
    return {
      answer: `暂未检索到 ${d1} 至 ${d2} 的新闻。可能是当日无发布，或网络受限未同步到最新数据。可点击出处到官网新闻栏目查看。`,
      sources: [{ title: "重庆交通大学新闻网", url: "https://news.cqjtu.edu.cn/index.htm" }],
    };
  }

  /* 2) FAQ：关键词加权评分 */
  let best = null, bestScore = 0;
  for (const f of FAQ) {
    let s = 0;
    f.keys.forEach((k) => { if (q.includes(k)) s += k.length; if (full.includes(k) && !q.includes(k)) s += k.length * 0.6; });
    if (s > bestScore) { best = f; bestScore = s; }
  }
  if (best && bestScore >= 2) return { answer: best.answer, sources: best.sources || [] };

  /* 3) 检索 + 抽取 */
  const qset = new Set(tokenize(full).filter((t) => t.length >= 2));
  const docs = [];
  KNOW.forEach((k) => docs.push({ title: k.title, url: k.url, date: "", text: k.content_text || "", boost: 1.35 }));
  NEWS.forEach((n) => docs.push({
    title: n.title, url: n.url, date: n.date,
    text: `${n.title} ${n.summary || ""} ${(n.content_text || "").slice(0, 1500)}`, boost: 1,
  }));
  const scored = [];
  docs.forEach((d, i) => {
    let s = 0;
    const tt = (d.title + "").repeat(3) + d.text;
    qset.forEach((t) => { if (tt.includes(t)) s += d.title.includes(t) ? 3 : 1; });
    if (s > 0) scored.push([s * d.boost, i]);
  });
  scored.sort((a, b) => b[0] - a[0]);
  const top = scored.slice(0, 5).map((x) => docs[x[1]]);
  if (!top.length) {
    return {
      answer: "暂未在官方资料中找到与该问题直接相关的内容。建议换个说法提问，或点击出处前往官网检索。",
      sources: [{ title: "重庆交通大学官网", url: "https://www.cqjtu.edu.cn/index.htm" }],
    };
  }
  const sents = [];
  top.forEach((d, rank) => {
    (d.text || "").split(/[。！？]/).forEach((s) => {
      s = s.replace(/\s+/g, " ").trim();
      if (s.length < 10 || s.length > 150) return;
      let hits = 0;
      qset.forEach((t) => { if (s.includes(t)) hits++; });
      if (!hits) return;
      sents.push([hits + (rank === 0 ? 0.8 : 0), s, rank, d]);
    });
  });
  sents.sort((a, b) => b[0] - a[0]);
  const picked = [], used = new Set();
  for (const it of sents) {
    const k = it[1].slice(0, 14);
    if (used.has(k)) continue;
    used.add(k);
    picked.push(it);
    if (picked.length >= 4) break;
  }
  const strong = picked.filter((p) => p[0] >= 2 || p[2] === 0);
  let answer;
  if (!strong.length) {
    answer = "暂未在官方资料中找到与该问题直接对应的表述，为您推荐以下相关官方资料（附原文链接）：\n" +
      top.slice(0, 4).map((d, i) => `${i + 1}. 《${d.title}》${d.date ? "（" + d.date + "）" : ""}：${(d.text || "").replace(/\s+/g, " ").slice(0, 80)}…`).join("\n") +
      "\n\n如果是教务政策类问题（如转专业、绩点、补考、选课、毕业学分等），请以教务处官方文件为准：https://jw.cqjtu.edu.cn/";
  } else {
    answer = "根据重庆交通大学官方公开资料：\n" +
      strong.map((p, i) => `${i + 1}. ${p[1]}［出处：《${p[3].title}》］`).join("\n") +
      "\n\n以上内容摘自学校官网/官方新闻网，点击下方出处链接可查看原文。";
  }
  return { answer, sources: top };
}

function askFromInput() {
  const input = $("#question");
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  const memoryQuery = buildQuery(q);
  /* 利用上文的追问，自动补齐话题词 */
  curConv.messages.push({ role: "user", text: q, ts: Date.now() });
  if (curConv.title === "新对话") {
    curConv.title = q.slice(0, 18) + (q.length > 18 ? "…" : "");
    renderConvList();
  }
  renderChat();
  const box = $("#chatBox");
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;
  setTimeout(async () => {
    typing.remove();
    /* 正文改为按需加载后，检索前先把命中候选的正文灌入，
       这样「问正文里的内容」依然能答出来 */
    try { await hydrateForSearch(new Set(tokenize(q).filter((t) => t.length >= 2))); } catch (e) {}
    const r = ask(q, memoryQuery);
    curConv.messages.push({ role: "bot", text: r.answer, sources: r.sources, ts: Date.now() });
    saveConvs();
    renderConvList();
    renderChat();
    haptic(12);
  }, 180);
}

/* ========================= 新闻查询 ========================= */
function runSearch() {
  const kw = $("#searchKw").value.trim();
  const col = $("#searchCol").value;
  const from = $("#searchFrom").value;
  const to = $("#searchTo").value;
  let items = NEWS.slice();
  if (col) items = items.filter((n) => n.column === col);
  if (from) items = items.filter((n) => n.date >= from);
  if (to) items = items.filter((n) => n.date <= to);
  if (kw) {
    const toks = tokenize(kw);
    items = items
      .map((n) => {
        const text = (n.title || "") + (n.summary || "") + (n.content_text || "").slice(0, 3000);
        let s = 0;
        toks.forEach((t) => { s += (text.split(t).length - 1); });
        if (n.title.includes(kw)) s += 5;
        return [s, n];
      })
      .filter((x) => x[0] > 0)
      .sort((a, b) => b[0] - a[0] || (b[1].date || "").localeCompare(a[1].date || ""))
      .map((x) => x[1]);
    /* 正文已改为按需加载，这里按分数取前若干篇补齐正文后重排一次，
       让「搜正文关键词」仍能命中，而不是只能搜标题和摘要 */
    if (items.length && toks.length) {
      const top = items.slice(0, 60);
      Promise.all(top.map((n) => ensureBody(n))).then(() => {
        top.forEach((n) => {
          toks.forEach((t) => {
            if ((n.content_text || "").includes(t)) n._boost = (n._boost || 0) + 1;
          });
        });
        top.sort((a, b) => (b._boost || 0) - (a._boost || 0));
        const box = $("#searchResult");
        box.innerHTML = `<div class="stat" style="margin:2px 2px 10px">共查询到 ${items.length} 条结果</div>` +
          top.concat(items.slice(60)).slice(0, 100).map(newsCard).join("");
      });
    }
  }
  const box = $("#searchResult");
  if (!items.length) {
    box.innerHTML = '<div class="empty">未查询到符合条件的官方新闻。可尝试更换关键词或放宽日期范围。</div>';
    return;
  }
  box.innerHTML = `<div class="stat" style="margin:2px 2px 10px">共查询到 ${items.length} 条结果</div>` +
    items.slice(0, 100).map(newsCard).join("");
}
$("#searchBtn").addEventListener("click", runSearch);

    <div class="actions">
      <a href="${esc(n.url)}" onclick="openLink('${esc(n.url)}');return false;">查看官方原文 ↗</a>
      <a class="alt" href="javascript:closeModal()">关闭</a>
    </div>`;
  $("#modal").classList.add("show");
  haptic(10);
  /* 正文优先从本地分桶取（快、离线可用）；分桶没有再走官网实时抓 */
  if (!n.content_html && !n.content_text) {
    const cached = await ensureBody(n);
    if (cached) {
      $("#articleBody").innerHTML = `<p>${esc(cached)}</p>`;
    } else if (n.url) {
      const html = await fetchText(n.url);
      if (html) {
        const art = parseArticle(html, n.url);
        Object.assign(n, art);
        $("#articleBody").innerHTML = n.content_html || `<p>${esc(n.content_text || "正文请查看官方原文。")}</p>`;
        saveNews([n]);
      } else {
        $("#articleBody").innerHTML = `<p style="color:var(--muted)">网络受限，正文加载失败。请点击下方“查看官方原文”在官网阅读完整内容。</p>`;
      }
    }
  }
}
function closeModal() { $("#modal").classList.remove("show"); haptic(6); }
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeSkin(); closeSide(); }
});

/* ========================= 初始化 ========================= */
loadSaved();
loadConvs();
renderConvList();
renderChat();
fxInit();
applySkin(currentSkin(), true);
setUpdate("ok", `📦 已加载官方新闻数据（截至 ${EMBED.generated || ""}，共 ${NEWS.length} 条）· 由云端每 6 小时自动更新`);
</script>
</body>
</html>

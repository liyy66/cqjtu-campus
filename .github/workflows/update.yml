# ============================================================
#  CQJTU Campus Assistant v3 - automated news fetch
#
#  Crawls the official news site on GitHub's cloud every 6 hours.
#  No local machine needs to be running.
#
#  NOTE: intentionally ASCII-only.
# ============================================================

name: Crawl CQJTU Campus v3

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: crawl-cqjtu-v3
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Crawl and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore previous crawl state
        run: |
          if [ -f state/news.jsonl ]; then
            python scripts/repo_state.py import
          else
            echo "First run: full crawl, this takes a while."
            mkdir -p data
            echo '[]' > data/news.json
          fi

      - name: Crawl official news
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          TZ: Asia/Shanghai
        run: |
          python scripts/crawl_news.py front
          python scripts/daily_update.py

      - name: Rebuild site
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          TZ: Asia/Shanghai
        run: |
          python scripts/build_v3.py
          python scripts/repo_state.py export

      - name: Show report
        run: cat data/_last_update.json

      - name: Build commit message
        run: python scripts/make_commit_msg.py

      - name: Commit data changes
        id: commit
        run: |
          git config user.name  "cqjtu-news-bot"
          git config user.email "cqjtu-news-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes this round."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -F commit_msg.txt
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Always upload + deploy, even when only the template changed.
      # (Previously gated on data changes, so UI fixes never went live.)
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
